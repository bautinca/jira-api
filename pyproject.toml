[project]
name = "jira-kanban-collector"
version = "0.1.0"
description = "Descarga adjuntos de la primera columna de un tablero Jira y los unifica"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-docx>=1.1,<2.0",
    "docxcompose>=1.4,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jira_collector = ["templates/*.html"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
